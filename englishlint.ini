# englishlint policy for laputa-systems/xsh-factory.
#
# The repository contains maintained guidance, machine-facing contracts,
# templates, and historical ticket/eval evidence. Do not apply one policy to
# every Markdown file.

[lint]
default_type = descriptive
procedural_limit = 20
descriptive_limit = 25
max_file_bytes = 10485760
ignore_rules =
ignore_words =

[glossary]
check = check
config = configuration
delete = delete

# Maintained guidance uses a review profile. Contracts use a quiet profile.
[profile.guidance]
paths = README.md, AGENTS.md, NORTH-STAR.md, FACTORY.md, CTO.md, FACTORY-PROMPT.md, docs/**, roles/**, runtime/**
ignore_rules = ENG001, ENG003, ENG006, ENG007, ENG008, ENG009, ENG010, ENG011, ENG012, ENG013, ENG014
severity = ENG001:warning, ENG002:warning, ENG003:warning, ENG005:warning, ENG006:warning, ENG007:warning, ENG008:warning, ENG009:warning, ENG010:warning, ENG011:warning, ENG012:warning, ENG013:warning, ENG014:warning, ENG015:warning

# Contracts and evidence use a quiet profile.
[profile.contracts]
paths = cycle-*.md, tickets/**, evals/**, templates/**
ignore_rules = ENG001, ENG002, ENG003, ENG005, ENG006, ENG007, ENG008, ENG009, ENG010, ENG011, ENG012, ENG013, ENG014, ENG015
