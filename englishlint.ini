# englishlint policy for laputa-systems/xsh-factory.
#
# The repository contains maintained guidance, machine-facing contracts,
# templates, and historical ticket/eval evidence. Do not apply one policy to
# every Markdown file.

[lint]
default_type = descriptive
procedural_limit = 20
descriptive_limit = 25
max_file_bytes = 10485760
ignore_rules =
ignore_words =

[glossary]
check = check
config = configuration
delete = delete

# Maintained guidance. Review errors first. Heuristics remain warnings or are
# disabled when the repository's contract language makes them noisy.
[profile.guidance]
paths = README.md, AGENTS.md, NORTH-STAR.md, FACTORY.md, CTO.md, FACTORY-PROMPT.md, docs/**, roles/**, runtime/**
ignore_rules = ENG011, ENG014
severity = ENG001:error, ENG002:error, ENG003:error, ENG004:error, ENG005:error, ENG006:error, ENG007:error, ENG008:error, ENG009:warning, ENG010:warning, ENG012:warning, ENG013:warning, ENG015:error

# Contracts and evidence. Keep high-signal wording findings as warnings.
# Do not enforce paragraph shape or sentence structure on exact examples,
# evaluator cases, ticket history, or templates.
[profile.contracts]
paths = cycle-*.md, tickets/**, evals/**, templates/**
ignore_rules = ENG001, ENG004, ENG009, ENG011, ENG012, ENG013, ENG014
severity = ENG002:warning, ENG003:warning, ENG005:warning, ENG006:warning, ENG008:warning, ENG010:warning, ENG015:warning
